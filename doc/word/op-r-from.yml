word: "r>"
wordset: core
f12-slug: Rfrom
stack: '( -- x )'
return-stack: '( R: x -- )'
description: 'Move x from the return stack to the stack.'
see:
  - "{forth:word}`>r`"
  - "{forth:word}`r@`"
  - "{forth:word}`i'`"
  - "{forth:word}`j`"
  - "{forth:word}`k`"  
  - "{forth:word}`rp@`"
  - "{forth:word}`rp!`"
