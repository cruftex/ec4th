word: ">number"
wordset: core
f12-slug: toNUMBER
stack: '( ud1 c-addr1 u1 -- ud2 c-addr2 u2 )'
description: 'Ud2 is the unsigned result of converting the characters within the string specified by c-addr1 u1 into digits, using the number in BASE, and adding each into ud1 after multiplying ud1 by the number in BASE.'
